version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    container_name: profsidekick-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # OpenAI (set your actual API key)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Application
      - DEBUG=true
      - SECRET_KEY=your-secret-key-change-in-production
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,https://profsidekick.vercel.app,https://profsidekick-frontend-3il7.vercel.app
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - profsidekick-network
    restart: unless-stopped

  # PostgreSQL Database (pgvector/pgvector:pg16 — includes the vector extension for RAG)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: profsidekick-postgres
    environment:
      - POSTGRES_DB=profsidekick
      - POSTGRES_USER=profsidekick
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profsidekick -d profsidekick"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profsidekick-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: profsidekick-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profsidekick-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: profsidekick-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@profsidekick.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - profsidekick-network
    restart: unless-stopped
    profiles:
      - admin

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: profsidekick-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - profsidekick-network
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  profsidekick-network:
    driver: bridge 