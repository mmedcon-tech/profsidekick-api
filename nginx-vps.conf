# Nginx configuration for routing two backend branches based on frontend origin
# Place this in /etc/nginx/sites-available/api.eliteflex.app
# Then symlink: sudo ln -s /etc/nginx/sites-available/api.eliteflex.app /etc/nginx/sites-enabled/

upstream backend_main {
    server localhost:8000;
}

upstream backend_autograder {
    server localhost:8001;
}

# Map to determine which backend to use based on Origin header
map $http_origin $backend_upstream {
    default backend_main;
    "https://profsidekick-autograder.vercel.app" backend_autograder;
    "http://profsidekick-autograder.vercel.app" backend_autograder;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.eliteflex.app;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.eliteflex.app;

    # SSL Configuration (adjust paths to your certificates)
    ssl_certificate /etc/letsencrypt/live/api.eliteflex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eliteflex.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/api.eliteflex.app.access.log;
    error_log /var/log/nginx/api.eliteflex.app.error.log;

    # Client upload size limit (adjust as needed)
    client_max_body_size 50M;

    # Proxy settings
    location / {
        # Route to appropriate backend based on Origin header
        proxy_pass http://$backend_upstream;
        
        # Preserve original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Pass the Origin header to backend for CORS
        proxy_set_header Origin $http_origin;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
