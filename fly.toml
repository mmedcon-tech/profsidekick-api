# fly.toml app configuration file generated for profsidekick-backend on 2025-06-12T02:13:39+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'profsidekick-backend'
primary_region = 'ord'

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = '0.0.0.0'
  PORT = "8000"
  STATIC_DIR = '/app/static'
  UPLOAD_DIR = '/app/uploads'

[[mounts]]
  source = "uploads_volume"
  destination = "/app/uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'get'
    path = '/health'
    protocol = 'http'
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
