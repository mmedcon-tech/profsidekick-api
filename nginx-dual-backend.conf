# Nginx configuration for routing two backend branches based on frontend origin
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled/

# Upstream for main backend (production)
upstream backend_main {
    server localhost:8000;
}

# Upstream for autograder backend (feature branch)
upstream backend_autograder {
    server localhost:8001;
}

# Main server block for api.eliteflex.app
server {
    listen 80;
    server_name api.eliteflex.app;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.eliteflex.app;

    # SSL Configuration (adjust paths to your certificates)
    ssl_certificate /etc/letsencrypt/live/api.eliteflex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eliteflex.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload size (adjust as needed)
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/api.eliteflex.app.access.log;
    error_log /var/log/nginx/api.eliteflex.app.error.log;

    # Default to main backend
    set $backend backend_main;

    # Route to autograder backend if request comes from autograder frontend
    if ($http_origin ~* "profsidekick-autograder\.app") {
        set $backend backend_autograder;
    }
    if ($http_referer ~* "profsidekick-autograder\.app") {
        set $backend backend_autograder;
    }

    location / {
        # Proxy headers
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # CORS headers (FastAPI should handle this, but backup)
        proxy_set_header Origin $http_origin;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # WebSocket support
        proxy_set_header Connection $connection_upgrade;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
