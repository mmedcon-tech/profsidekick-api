# Nginx configuration for routing two backend branches based on frontend origin
# Active file on server: /etc/nginx/sites-available/api.eliteflex.app
# Included by nginx.conf inside the http{} block via sites-enabled/*

# ---------------------------------------------------------------------------
# http-context directives — map, upstream, log_format must be here (not in server{})
# ---------------------------------------------------------------------------

# Custom log format — shows which backend handled each request
log_format routing '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_x_frontend_instance" "$http_origin" -> $backend';

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Backend routing — two-tier strategy:
#
# Tier 1 (preferred): X-Frontend-Instance header
#   Set NEXT_PUBLIC_FRONTEND_INSTANCE=autograder in the autograder Vercel env.
#   All server-side Next.js fetches include this header explicitly.
#   Values: "autograder" → backend_autograder | "main" or absent → backend_main
#
# Tier 2 (fallback): Origin / Referer
#   For direct browser requests that don't carry the custom header.
# ---------------------------------------------------------------------------

# Tier 1: map the X-Frontend-Instance header value
map $http_x_frontend_instance $instance_backend {
    default      "";               # absent or unknown — fall through to tier 2
    "autograder" backend_autograder;
    "main"       backend_main;
}

# Tier 2 step A: normalise signal — prefer Origin, fall back to Referer
map $http_origin $routing_signal {
    default  $http_origin;
    ""       $http_referer;
}

# Tier 2 step B: resolve backend from the normalised origin signal
map $routing_signal $origin_backend {
    default                                  backend_main;
    "~*profsidekick-autograder\.vercel\.app" backend_autograder;
}

# Upstream for main backend (production) — port 8000
upstream backend_main {
    server localhost:8000;
}

# Upstream for autograder backend (feature branch) — port 8001
upstream backend_autograder {
    server localhost:8001;
}

# ---------------------------------------------------------------------------
# HTTP server block — Cloudflare terminates TLS externally, no redirect needed
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.eliteflex.app;

    client_max_body_size 100M;

    access_log /var/log/nginx/api.eliteflex.app.access.log routing;
    error_log /var/log/nginx/api.eliteflex.app.error.log;

    location / {
        # Tier 1: use X-Frontend-Instance if set; otherwise fall back to origin-based routing
        set $backend $instance_backend;
        if ($backend = "") {
            set $backend $origin_backend;
        }

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin $http_origin;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server block — Cloudflare Origin Certificate (not Let's Encrypt)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.eliteflex.app;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # Log shows: instance_header | origin | -> backend_main/backend_autograder
    access_log /var/log/nginx/api.eliteflex.app.access.log routing;
    error_log /var/log/nginx/api.eliteflex.app.error.log;

    location / {
        # Tier 1: use X-Frontend-Instance if set; otherwise fall back to origin-based routing
        set $backend $instance_backend;
        if ($backend = "") {
            set $backend $origin_backend;
        }

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin $http_origin;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
